<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

                        "on-tertiary-container": "#747676",
                        "on-surface-variant": "#444748",
                        "primary-container": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e2e2e2",
                        "error": "#ba1a1a",
                        "on-primary-container": "#747676",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#c6c6c7",
                        "surface-variant": "#e5e2e1",
                        "surface": "#fcf8f8",
                        "outline-variant": "#c4c7c8",
                        "surface-bright": "#fcf8f8",
                        "primary": "#5d5f5f",

                        "gutter": "24px",

                        "xl": "80px",
                        "lg": "48px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "64px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"],

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-lg">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.05)] border border-outline-variant/10 overflow-hidden flex flex-col p-md md:p-lg">
<!-- Brand Identity Anchor -->
<div class="flex flex-col items-center mb-lg text-center">
<div class="mb-sm">
<span class="text-headline-md font-headline-md font-extrabold text-error">Вояж-Тур</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface">Вход в личный кабинет</h1>
<p class="text-label-md font-label-md text-on-surface-variant mt-xs">С возвращением! Продолжите свое путешествие вместе с нами.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-md">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface ml-xs" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-error transition-colors">mail</span>
<input class="w-full h-12 pl-lg pr-md rounded-lg border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-error/20 focus:border-error outline-none transition-all text-body-md font-body-md" id="email" placeholder="example@voyage.ru" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="text-label-md font-label-md text-on-surface" for="password">Пароль</label>
<a class="text-label-md font-label-md text-error hover:underline transition-all" href="#">Забыли пароль?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-error transition-colors">lock</span>
<input class="w-full h-12 pl-lg pr-md rounded-lg border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-error/20 focus:border-error outline-none transition-all text-body-md font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-xs px-xs">
<input class="w-4 h-4 rounded border-outline-variant text-error focus:ring-error cursor-pointer" id="remember" type="checkbox"/>
<label class="text-label-md font-label-md text-on-surface-variant cursor-pointer" for="remember">Запомнить меня</label>
</div>
<button class="w-full h-14 bg-error text-white font-label-md text-label-md rounded-lg hover:bg-error/90 active:scale-95 transition-all shadow-md" type="submit">
                    Войти
                </button>
</form>
<!-- Separator -->
<div class="relative flex items-center my-lg">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-md text-label-md font-label-md text-on-surface-variant">ИЛИ</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-base h-12 rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-high transition-colors text-label-md font-label-md text-on-surface">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyri-NJFoUTSe9HMikgjRqHBvZtfQDfZ94exHSM7wuVpR_-jJgNyXZ6oU0eOjhxlITN7whDezT_FFZgUBG0WcFtnzn6Omc70OqEZnRI0xPOjc95Vx7hQxJqYBsJB0l9sQpWhO07h3phS85I9QZeffwGfOqz2WZ0-nmWPGSqzTP-VfAP6iyVXoEpJ7i5REBbnZp0W5JWsMLa8kGogC4O0aXDi6Loye9PbB6ZZ09AkLatFESsuaDsOIQ_HY-5iAIbsYDrb9jMLVKXln3"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-base h-12 rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-high transition-colors text-label-md font-label-md text-on-surface">
<span class="material-symbols-outlined text-[#26A5E4]" style="font-variation-settings: 'FILL' 1;">send</span>
                    Telegram
                </button>
</div>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="text-label-md font-label-md text-on-surface-variant">
                    Еще не зарегистрированы? 
                    <a class="text-error font-bold hover:underline ml-xs" href="#">Создать аккаунт</a>
</p>
</div>
</div>
</main>
<!-- Simple Footer for Transactional Page -->
<footer class="py-md text-center border-t border-outline-variant/10">
<p class="text-caption font-body-md text-on-surface-variant opacity-70">© 2024 Вояж-Тур. Все права защищены.</p>
</footer>
<script src="../assets/js/cursor-glow.js"></script>
</body></html>
