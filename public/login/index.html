<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Вояж-Тур</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Вход</h1>
    <p class="text-gray-500 mb-6">Войдите в личный кабинет</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
        <input type="password" id="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
      </div>

      <div id="error" class="hidden text-red-600 text-sm"></div>

      <button type="submit"
              class="w-full bg-red-600 hover:bg-orange-500 text-white font-semibold py-2.5 rounded-lg transition">
        Войти
      </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      Нет аккаунта?
      <a href="../register/" class="text-red-600 hover:underline">Зарегистрироваться</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || 'Ошибка входа';
        errEl.classList.remove('hidden');
        return;
      }
      localStorage.setItem('voyage_user', JSON.stringify(data));
      window.location.href = '../account/';
    });
  </script>
</body>
</html>
