<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Вояж-Тур</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Регистрация</h1>
    <p class="text-gray-500 mb-6">Создайте аккаунт Вояж-Тур</p>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
        <input type="text" id="name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
        <input type="password" id="password" required minlength="6"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
      </div>

      <div id="error" class="hidden text-red-600 text-sm"></div>
      <div id="success" class="hidden text-green-600 text-sm"></div>

      <button type="submit"
              class="w-full bg-red-600 hover:bg-orange-500 text-white font-semibold py-2.5 rounded-lg transition">
        Зарегистрироваться
      </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      Уже есть аккаунт?
      <a href="../login/" class="text-red-600 hover:underline">Войти</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      const okEl = document.getElementById('success');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || 'Ошибка регистрации';
        errEl.classList.remove('hidden');
        return;
      }
      okEl.textContent = 'Готово! Перенаправляем на вход...';
      okEl.classList.remove('hidden');
      setTimeout(() => window.location.href = '../login/', 1200);
    });
  </script>
</body>
</html>
